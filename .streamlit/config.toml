[theme]
base = "light"
primaryColor = "#8B7FD1"
backgroundColor = "#F7F5F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2F2B36"
# Nunito Sans (rounded, tidy) with IBM Plex Mono for code; system fonts are the offline fallback.
font = "Nunito Sans:https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"

[client]
toolbarMode = "minimal"
